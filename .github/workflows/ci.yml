name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install constrained development dependencies
        run: |
          python -m pip install --constraint constraints.txt hatchling==1.32.0 setuptools==84.0.0
          python -m pip install --constraint constraints.txt --no-build-isolation '.[dev]'
          python -m pip check
      - name: Compile and import
        run: |
          python -m compileall -q src tests
          python -c "import telegram_codex.server, telegram_codex.remote_server"
          command -v telegram-codex
          command -v telegram-codex-setup
          command -v telegram-codex-doctor
          telegram-codex-setup --help > /dev/null
          telegram-codex-doctor --help > /dev/null
      - name: Validate plugin manifests
        run: |
          python -m json.tool .agents/plugins/marketplace.json > /dev/null
          python -m json.tool plugins/telegram-for-codex/.codex-plugin/plugin.json > /dev/null
          python -m json.tool plugins/telegram-for-codex/.mcp.json > /dev/null
          python -c "import json; from importlib.metadata import version; from pathlib import Path; root=Path('.'); plugin=root/'plugins/telegram-for-codex'; marketplace=json.loads((root/'.agents/plugins/marketplace.json').read_text()); manifest=json.loads((plugin/'.codex-plugin/plugin.json').read_text()); mcp=json.loads((plugin/'.mcp.json').read_text()); entry=marketplace['plugins'][0]; server=mcp['mcpServers']['telegram']; tools=server['tools']; private_reads=('telegram_audit_log','telegram_list_chats','telegram_get_messages','telegram_search_messages'); assert marketplace['name']=='telegram-for-codex'; assert entry['name']=='telegram-for-codex'; assert entry['source']=={'source':'local','path':'./plugins/telegram-for-codex'}; assert manifest['name']=='telegram-for-codex'; assert manifest['version']==version('telegram-for-codex'); assert manifest['mcpServers']=='./.mcp.json'; assert 'apps' not in manifest; assert server['command']=='telegram-codex'; assert server['default_tools_approval_mode']=='prompt'; assert tools['telegram_whoami']['approval_mode']=='auto'; assert all(tools[name]['approval_mode']=='prompt' for name in private_reads); assert tools['telegram_send_message']['approval_mode']=='prompt'; assert tools['telegram_edit_message']['approval_mode']=='prompt'"
      - name: Test
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag telegram-for-codex:test .
      - name: Verify non-root runtime and private data directory
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' telegram-for-codex:test)" = "10001:10001"
          volume="telegram-codex-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm -f "$volume"' EXIT
          docker run --rm --user 0 \
            --mount "type=volume,source=$volume,target=/data/telegram,volume-nocopy" \
            telegram-for-codex:test \
            python -c 'import os, stat; info=os.stat("/data/telegram"); assert os.geteuid()==10001; assert stat.S_IMODE(info.st_mode)==0o700; assert info.st_uid==10001'
