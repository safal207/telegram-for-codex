[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telegram-for-codex"
version = "0.2.0"
description = "Use a real Telegram user account from ChatGPT and Codex through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.27,<2",
  "telethon>=1.40,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
telegram-codex = "telegram_codex.server:main"
telegram-codex-auth = "telegram_codex.auth:main"
telegram-codex-remote = "telegram_codex.remote_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_codex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
